name: VJIT Bus Tracker CI Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  verification:
    name: Lint, Typecheck, Security & Unit Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Anti-Mock Rules (Rule B.2)
        run: node scripts/verify-no-mock.mjs

      - name: Verify Clean Repository (Zero Docker)
        run: node scripts/verify-prod-clean.mjs

      - name: Custom Static Analysis Lint
        run: node scripts/lint.mjs

      - name: Verify Route Auth Coverage
        run: node scripts/verify-routes-auth.mjs

      - name: Run Test Suites
        run: npm test
